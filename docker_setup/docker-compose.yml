version: "3.1"

services:
  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=openpg
      - POSTGRES_PASSWORD=openpgpwd
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ../custom_addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=openpg
      - PASSWORD=openpgpwd

volumes:
  odoo-db-data:
